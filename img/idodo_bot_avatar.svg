<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 品牌暖光陰影 -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F4B32A" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="70%" stop-color="#FFF3D4"/>
      <stop offset="100%" stop-color="#FFE7A3"/>
    </radialGradient>
    <linearGradient id="yellow-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC53D"/>
      <stop offset="100%" stop-color="#F4B32A"/>
    </linearGradient>
  </defs>

  <!-- 圓形徽章背景 (官網暖黃漸層) -->
  <circle cx="100" cy="100" r="94" fill="url(#bg-grad)" stroke="#F4B32A" stroke-width="4" filter="url(#soft-shadow)"/>

  <!-- 背景小裝飾：閃爍幾何星星/烘焙碎香 -->
  <path d="M42 45 L45 38 L48 45 L55 48 L48 51 L45 58 L42 51 L35 48 Z" fill="#F4B32A" opacity="0.6"/>
  <circle cx="158" cy="42" r="3" fill="#F4B32A" opacity="0.7"/>
  <circle cx="168" cy="52" r="2" fill="#E74C3C" opacity="0.6"/>

  <!-- 熊熊雙耳 -->
  <!-- 左耳 -->
  <circle cx="58" cy="62" r="22" fill="#2C1D18"/>
  <circle cx="58" cy="62" r="13" fill="#FAD4C0"/>
  <!-- 右耳 -->
  <circle cx="142" cy="62" r="22" fill="#2C1D18"/>
  <circle cx="142" cy="62" r="13" fill="#FAD4C0"/>

  <!-- 頭部底色 (黑熊深棕) -->
  <ellipse cx="100" cy="102" rx="46" ry="43" fill="#2C1D18"/>

  <!-- 身體與暖黃圍裙 (露出上半截) -->
  <path d="M60 142 Q100 132 140 142 L148 190 Q100 196 52 190 Z" fill="#2C1D18"/>
  <!-- 胸前台灣黑熊招牌 V 字領 -->
  <path d="M80 143 L100 162 L120 143 L112 143 L100 154 L88 143 Z" fill="#FFFDF7"/>
  <!-- 品牌暖黃圍裙 (Apron) -->
  <path d="M68 152 Q100 146 132 152 L142 194 Q100 200 58 194 Z" fill="url(#yellow-brand)"/>
  <!-- 圍裙中心愛心符號 (起家心願) -->
  <path d="M100 168 C96 163 88 163 88 170 C88 176 100 184 100 184 C100 184 112 176 112 170 C112 163 104 163 100 168 Z" fill="#E74C3C"/>

  <!-- 熊熊臉部：白色口鼻區 -->
  <ellipse cx="100" cy="112" rx="23" ry="18" fill="#FFFDF7"/>
  
  <!-- 鼻子 (黑可可心型圓角) -->
  <path d="M93 104 Q100 101 107 104 Q108 111 100 114 Q92 111 93 104 Z" fill="#2C1D18"/>
  <!-- 微笑嘴巴 -->
  <path d="M100 114 L100 119 M94 119 Q100 126 106 119" stroke="#2C1D18" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- 眼睛 (親切大眼 + 眼神光) -->
  <!-- 左眼 -->
  <ellipse cx="80" cy="94" rx="6.5" ry="8" fill="#2C1D18"/>
  <circle cx="82" cy="92" r="2.8" fill="#FFFDF7"/>
  <circle cx="78" cy="96" r="1.2" fill="#FFFDF7"/>
  <!-- 右眼 -->
  <ellipse cx="120" cy="94" rx="6.5" ry="8" fill="#2C1D18"/>
  <circle cx="122" cy="92" r="2.8" fill="#FFFDF7"/>
  <circle cx="118" cy="96" r="1.2" fill="#FFFDF7"/>

  <!-- 腮紅 (暖暖粉紅) -->
  <ellipse cx="68" cy="108" rx="8" ry="5" fill="#FF8A80" opacity="0.55"/>
  <ellipse cx="132" cy="108" rx="8" ry="5" fill="#FF8A80" opacity="0.55"/>

  <!-- 客服通訊耳機 (Headset) -->
  <!-- 頭頂耳機弧架 -->
  <path d="M54 75 Q100 36 146 75" fill="none" stroke="#4A4A4A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 左耳罩 (深灰 + 鴻鼎黃點綴) -->
  <rect x="47" y="70" width="10" height="22" rx="5" fill="#333333"/>
  <rect x="52" y="74" width="4" height="14" rx="2" fill="#F4B32A"/>
  <!-- 右耳罩 -->
  <rect x="143" y="70" width="10" height="22" rx="5" fill="#333333"/>
  <rect x="144" y="74" width="4" height="14" rx="2" fill="#F4B32A"/>

  <!-- 麥克風話筒支架與收音頭 -->
  <path d="M148 88 Q146 122 118 126" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
  <circle cx="116" cy="126" r="5" fill="#F4B32A"/>
  <circle cx="116" cy="126" r="2.5" fill="#333333"/>

  <!-- 揮動打招呼的熊熊小手 (右側小掌) -->
  <g transform="translate(142, 120)">
    <circle cx="14" cy="14" r="13" fill="#2C1D18"/>
    <!-- 肉球 -->
    <ellipse cx="14" cy="16" rx="6" ry="4.5" fill="#FAD4C0"/>
    <circle cx="9" cy="9" r="2" fill="#FAD4C0"/>
    <circle cx="14" cy="7" r="2" fill="#FAD4C0"/>
    <circle cx="19" cy="9" r="2" fill="#FAD4C0"/>
  </g>
</svg>
